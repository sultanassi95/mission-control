<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6A70" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111819" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="" id="theme-color">
<title>Mission Control</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="theme.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="grow">
      <h1 id="title">Sessions</h1>
      <p class="sub" id="link" role="status"><span class="dot" aria-hidden="true"></span><span id="link-text">Connecting…</span></p>
    </div>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
  <div class="composer" id="theme-box">
    <div class="seg" role="group" aria-label="Theme" id="theme">
      <button type="button" data-t="system" aria-pressed="true">System</button>
      <button type="button" data-t="light" aria-pressed="false">Light</button>
      <button type="button" data-t="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
