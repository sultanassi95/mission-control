<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6A70" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111819" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="" id="theme-color">
<title>Mission Control</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="theme.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="grow">
      <h1 id="title">Flight</h1>
      <p class="sub" id="link" role="status"><span class="dot" aria-hidden="true"></span><span id="link-text">Connecting to Flight…</span></p>
    </div>
    <button class="profbtn" id="profile" type="button" hidden><span id="profile-name">Profile</span><span class="dot" id="profile-dot" aria-hidden="true" hidden></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="iconbtn" id="menu" type="button" aria-label="Fleet menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
  <div class="composer" id="composer">
    <div class="quick" id="quick"></div>
    <div class="tray" id="tray" hidden><ul class="att-row" id="tray-items" aria-label="Files to send"></ul><p class="hint" id="tray-hint" role="status"></p></div>
    <form class="row" id="send">
      <button class="slash" type="button" id="slash" aria-label="Commands">/</button>
      <button class="slash attach" type="button" id="attach" aria-label="Attach photos or files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
      <input type="file" id="files" accept="image/*,.pdf,.txt,.md,.csv,.json" multiple hidden>
      <label class="visually-hidden" for="draft">Message Flight</label>
      <textarea id="draft" rows="1" placeholder="Message Flight" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences"></textarea>
      <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="md.js"></script>
<script src="badge.js"></script>
<script src="transcript.js"></script>
<script src="app.js"></script>
</body>
</html>
